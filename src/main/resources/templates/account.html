<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${account.name + ' · Operations Console'}"></title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a href="/" class="brand">Brahma <span>Operations</span></a><span class="environment">Staging</span></header>
<main><a href="/" class="back">← All accounts</a><p class="eyebrow">ACCOUNT DETAILS</p>
<h1 th:text="${account.name}"></h1><p class="intro" th:text="${account.id}"></p>
<section class="card details" aria-label="Account details"><dl>
<dt>Risk score</dt><dd><span class="risk-badge" th:classappend="${account.riskClass}" th:text="${account.riskLabel + (account.riskScore == null ? '' : ' · ' + account.riskScore)}"></span></dd>
<dt>Industry</dt><dd th:text="${account.industry}"></dd>
<dt>Country</dt><dd th:text="${account.country}"></dd>
<dt>Plan</dt><dd th:text="${account.plan}"></dd>
<dt>Monthly spend (USD)</dt><dd th:text="${#numbers.formatDecimal(account.monthlySpendUsd, 1, 'COMMA', 2, 'POINT')}"></dd>
<dt>Open tickets</dt><dd th:text="${account.openTickets}"></dd>
<dt>Days since last login</dt><dd th:text="${account.daysSinceLastLogin}"></dd>
<dt>Created</dt><dd th:text="${account.createdAt}"></dd>
</dl></section></main><footer>Internal operations · Synthetic demo data</footer></body></html>
